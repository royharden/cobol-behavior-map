[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-behavior-map"
version = "0.1.0"
description = "Bounded COBOL behavior mapping and source construction; runtime unverified"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
cbm = "cobolmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cobolmap*"]
